<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca — Acervo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0f0c12; --bg-soft:#171219; --panel:#1c1620;
  --ink:#ece4d8; --ink-soft:#948b96; --ink-faint:#5c5462;
  --accent:#c9a227; --border:rgba(236,228,216,.1);
  --c-acao:#7a2e1f; --c-suspense:#2a3347; --c-terror:#2f3b2a;
  --c-mais18:#4a1f2b; --c-magia:#5b3a6b; --c-romance:#7a2e3d;
  --c-fantasia:#3a4a63; --c-documentarios:#3a3a2a; --c-ficcao:#2e4a4a;
}
*{box-sizing:border-box;}
body{
  margin:0; background:
    radial-gradient(900px 500px at 12% -8%, #241b28, transparent 60%),
    radial-gradient(700px 500px at 105% 10%, #1b2230, transparent 55%),
    var(--bg);
  color:var(--ink); font-family:'Inter',sans-serif;
}
.mono{font-family:'JetBrains Mono',monospace;}
::selection{background:var(--accent); color:#171219;}

header{
  position:sticky; top:0; z-index:50; backdrop-filter:blur(10px);
  background:rgba(15,12,18,.75); border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:20px; padding:16px clamp(20px,5vw,64px);
}
.logo{ font-family:'Fraunces',serif; font-weight:600; font-size:18px; display:flex; align-items:center; gap:8px; flex-shrink:0;}
.logo a{ color:inherit; text-decoration:none; display:flex; align-items:center; gap:8px;}
.logo .mark{ color:var(--accent); font-size:20px; line-height:1;}
.search-wrap{ position:relative; flex:1; max-width:420px;}
.search-wrap input{
  width:100%; background:var(--panel); border:1px solid var(--border); color:var(--ink);
  padding:11px 16px 11px 38px; border-radius:999px; font-size:13.5px; font-family:'Inter',sans-serif;
}
.search-wrap input:focus{ outline:none; border-color:var(--accent);}
.search-wrap svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--ink-faint); pointer-events:none;}
.shelf-icon-link{
  margin-left:auto; width:40px; height:40px; border-radius:50%; border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative;
}
.shelf-icon-link:hover{ border-color:var(--accent);}
.shelf-icon-link svg{ width:17px; height:17px; color:var(--ink-soft);}
.shelf-count{
  position:absolute; top:-4px; right:-4px; background:var(--accent); color:#171219;
  font-size:10px; font-weight:700; width:17px; height:17px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace;
}

main{ padding:20px clamp(20px,5vw,64px) 80px;}
.search-results{ padding-top:10px;}
.search-results h2{ font-family:'Fraunces',serif; font-size:20px; margin-bottom:16px;}

.genre-section{ margin-top:38px;}
.genre-head{ display:flex; align-items:baseline; gap:12px; margin-bottom:16px;}
.genre-head h2{ font-family:'Fraunces',serif; font-weight:600; font-size:21px; margin:0;}
.genre-head span{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint);}
.genre-row{
  display:flex; gap:16px; overflow-x:auto; padding-bottom:10px; scroll-snap-type:x proximity;
}
.genre-row::-webkit-scrollbar{ height:6px;}
.genre-row::-webkit-scrollbar-thumb{ background:var(--border); border-radius:99px;}

.book-block{
  flex:0 0 148px; cursor:pointer; scroll-snap-align:start;
}
.b-cover{
  width:148px; height:210px; border-radius:8px; position:relative; overflow:hidden;
  box-shadow:0 14px 24px -14px rgba(0,0,0,.7);
  transition:transform .18s ease, box-shadow .18s ease;
  display:flex; align-items:flex-end; justify-content:center; text-align:center; padding:14px;
}
.book-block:hover .b-cover{ transform:translateY(-4px); box-shadow:0 18px 30px -14px rgba(0,0,0,.8);}
.b-cover .b-fallback{ font-family:'Fraunces',serif; font-weight:600; font-size:14px; color:#fff; line-height:1.25;}
.b-title{ font-family:'Fraunces',serif; font-weight:600; font-size:13.5px; margin-top:10px; line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.b-pages{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-faint); margin-top:4px;}

.empty-state{ text-align:center; padding:60px 20px; color:var(--ink-faint); font-size:13.5px;}

/* ---------- MODAL ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(8,6,10,.72); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; z-index:100; opacity:0; pointer-events:none;
  transition:opacity .22s ease; padding:20px;
}
.overlay.show{ opacity:1; pointer-events:auto;}
.book-modal{
  background:var(--panel); border:1px solid var(--border); border-radius:18px;
  max-width:720px; width:100%; max-height:88vh; overflow-y:auto;
  display:grid; grid-template-columns:220px 1fr;
  transform:translateY(14px) scale(.98); transition:transform .22s ease;
}
.overlay.show .book-modal{ transform:translateY(0) scale(1);}
.modal-cover{ padding:28px; display:flex; align-items:center; justify-content:center; background:var(--bg-soft);}
.modal-cover .b-cover{ width:100%; max-width:180px; height:auto; aspect-ratio:148/210;}
.modal-body{ padding:30px 32px 32px; position:relative;}
.modal-close{
  position:absolute; top:18px; right:18px; width:28px; height:28px; border-radius:50%;
  border:1px solid var(--border); background:none; color:var(--ink-soft); font-size:14px;
}
.modal-body .m-cat{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--accent); margin-bottom:10px; display:block;}
.modal-body h2{ font-family:'Fraunces',serif; font-weight:600; font-size:24px; margin:0 0 6px; line-height:1.15;}
.modal-body .m-pages{ color:var(--ink-faint); font-size:12.5px; margin-bottom:18px; font-family:'JetBrains Mono',monospace;}
.modal-body .m-synopsis{ color:var(--ink-soft); font-size:14px; line-height:1.7; margin-bottom:24px;}
.add-btn{
  background:var(--accent); color:#171219; border:none; padding:13px 28px; border-radius:999px;
  font-weight:600; font-size:13.5px; letter-spacing:.02em; width:100%; display:flex; align-items:center;
  justify-content:center; gap:8px; transition:background .2s ease, color .2s ease;
}
.add-btn.added{ background:var(--bg-soft); color:var(--accent); border:1px solid var(--accent);}

@media (max-width:760px){
  header{ flex-wrap:wrap;}
  .search-wrap{ order:3; max-width:none; width:100%;}
  .overlay{ align-items:flex-end; padding:0;}
  .book-modal{
    grid-template-columns:1fr; max-height:92vh; width:100%;
    border-radius:18px 18px 0 0;
  }
  .modal-cover{ padding:22px 22px 0; background:transparent;}
  .modal-cover .b-cover{ width:130px; max-width:130px; margin:0 auto;}
  .modal-body{ padding:18px 24px 28px;}
}
</style>
</head>
<body>

<header>
  <div class="logo"><a href="index.html"><span class="mark">✦</span> Acervo</a></div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="search-input" placeholder="Buscar por título ou autor...">
  </div>
  <a class="shelf-icon-link" href="estante.html" title="Minha estante">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M4 4v16M20 4v16M4 4h16M9 4v16M15 4v16"/>
    </svg>
    <span class="shelf-count" id="shelf-count">0</span>
  </a>
</header>

<main id="main"></main>

<div class="overlay" id="overlay">
  <div class="book-modal">
    <div class="modal-cover"><div class="b-cover" id="modal-cover-box"></div></div>
    <div class="modal-body">
      <button class="modal-close" id="modal-close">✕</button>
      <span class="m-cat" id="modal-cat"></span>
      <h2 id="modal-title"></h2>
      <div class="m-pages" id="modal-pages"></div>
      <div class="m-synopsis" id="modal-synopsis"></div>
      <button class="add-btn" id="add-btn">Adicionar à estante</button>
    </div>
  </div>
</div>

<script>
/* ---------------- DADOS (Supabase) ---------------- */
const CATEGORIES = [
  {id:'acao', label:'Ação'},
  {id:'suspense', label:'Suspense'},
  {id:'terror', label:'Terror'},
  {id:'mais18', label:'+18'},
  {id:'magia', label:'Magia'},
  {id:'romance', label:'Romance'},
  {id:'fantasia', label:'Fantasia'},
  {id:'documentarios', label:'Documentários'},
  {id:'ficcao', label:'Ficção'},
];

const SUPABASE_URL = 'https://xdmayiruvcfwakcjmuay.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkbWF5aXJ1dmNmd2FrY2ptdWF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODg5MTUsImV4cCI6MjEwMjA2NDkxNX0.bTul_H7leU6rS4qfieqLmr9mYcOhZF_4j25bT65m7lw';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let BOOKS = [];

async function loadBooks(){
  const { data: books, error } = await sb.from('books').select('*').order('created_at', { ascending:false });
  if(error){ console.error(error); main.innerHTML = `<div class="empty-state">Erro ao carregar os livros.</div>`; return; }

  const { data: chapters } = await sb.from('book_chapters').select('book_id');
  const chCount = {};
  (chapters||[]).forEach(c => { chCount[c.book_id] = (chCount[c.book_id]||0) + 1; });

  BOOKS = (books||[]).map(b => ({
    id: b.id,
    title: b.title,
    category: b.category,
    synopsis: b.summary || '',
    cover: b.cover_url || null,
    chapters: chCount[b.id] || 0,
  }));
  render();
}

/* ---------------- COOKIES ---------------- */
function setCookie(name, value, days){
  const d = new Date(); d.setTime(d.getTime() + days*24*60*60*1000);
  document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
}
function getCookie(name){
  const match = document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'));
  return match ? decodeURIComponent(match[2]) : null;
}
function getEstante(){
  const raw = getCookie('acervo_estante');
  return raw ? raw.split(',').filter(Boolean) : [];
}
function saveEstante(ids){
  setCookie('acervo_estante', ids.join(','), 365);
}

function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
function labelFor(catId){ return (CATEGORIES.find(c=>c.id===catId)||{}).label || catId; }
function coverStyle(catId){ return `background:linear-gradient(160deg, var(--c-${catId}), #14101a);`; }

/* ---------------- RENDER PRINCIPAL ---------------- */
const main = document.getElementById('main');
let searchTerm = '';

function bookBlockHtml(book){
  return `
    <div class="book-block" data-id="${book.id}">
      <div class="b-cover" style="${coverStyle(book.category)}">
        ${book.cover ? `<img src="${book.cover}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">` : `<span class="b-fallback">${escapeHtml(book.title)}</span>`}
      </div>
      <div class="b-title">${escapeHtml(book.title)}</div>
      <div class="b-pages">${book.chapters} capítulo${book.chapters===1?'':'s'}</div>
    </div>
  `;
}

function render(){
  main.innerHTML = '';

  if(!BOOKS.length){
    main.innerHTML = `<div class="empty-state">Nenhum livro publicado ainda.</div>`;
    return;
  }

  if(searchTerm){
    const filtered = BOOKS.filter(b=>
      b.title.toLowerCase().includes(searchTerm)
    );
    const wrap = document.createElement('div');
    wrap.className = 'search-results';
    wrap.innerHTML = `<h2>${filtered.length} resultado${filtered.length===1?'':'s'} para "${escapeHtml(searchTerm)}"</h2>`;
    if(filtered.length === 0){
      wrap.innerHTML += `<div class="empty-state">Nenhuma história encontrada.</div>`;
    } else {
      const row = document.createElement('div');
      row.className = 'genre-row';
      row.style.flexWrap = 'wrap';
      row.innerHTML = filtered.map(bookBlockHtml).join('');
      wrap.appendChild(row);
    }
    main.appendChild(wrap);
    attachBookClicks();
    return;
  }

  CATEGORIES.forEach(cat=>{
    const books = BOOKS.filter(b=>b.category === cat.id);
    if(books.length === 0) return;
    const section = document.createElement('section');
    section.className = 'genre-section';
    section.innerHTML = `
      <div class="genre-head"><h2>${cat.label}</h2><span>${books.length} título${books.length===1?'':'s'}</span></div>
      <div class="genre-row">${books.map(bookBlockHtml).join('')}</div>
    `;
    main.appendChild(section);
  });
  attachBookClicks();
}

function attachBookClicks(){
  document.querySelectorAll('.book-block').forEach(el=>{
    el.addEventListener('click', ()=>{
      const book = BOOKS.find(b=>b.id === el.dataset.id);
      if(book) openModal(book);
    });
  });
}

/* ---------------- MODAL ---------------- */
const overlay = document.getElementById('overlay');
const modalCoverBox = document.getElementById('modal-cover-box');
const modalCat = document.getElementById('modal-cat');
const modalTitle = document.getElementById('modal-title');
const modalPages = document.getElementById('modal-pages');
const modalSynopsis = document.getElementById('modal-synopsis');
const addBtn = document.getElementById('add-btn');
let currentBook = null;

function openModal(book){
  currentBook = book;
  modalCoverBox.setAttribute('style', coverStyle(book.category));
  modalCoverBox.innerHTML = book.cover ? `<img src="${book.cover}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:8px;">` : `<span class="b-fallback">${escapeHtml(book.title)}</span>`;
  modalCat.textContent = labelFor(book.category);
  modalTitle.textContent = book.title;
  modalPages.textContent = `${book.chapters} capítulo${book.chapters===1?'':'s'}`;
  modalSynopsis.textContent = book.synopsis;
  updateAddBtn();
  overlay.classList.add('show');
}
function updateAddBtn(){
  const inEstante = getEstante().includes(currentBook.id);
  addBtn.textContent = inEstante ? '✓ Na sua estante' : 'Adicionar à estante';
  addBtn.classList.toggle('added', inEstante);
}
addBtn.addEventListener('click', ()=>{
  const ids = getEstante();
  if(!ids.includes(currentBook.id)){
    ids.push(currentBook.id);
    saveEstante(ids);
    updateShelfCount();
  }
  updateAddBtn();
});
document.getElementById('modal-close').addEventListener('click', ()=> overlay.classList.remove('show'));
overlay.addEventListener('click', (e)=>{ if(e.target === overlay) overlay.classList.remove('show'); });

/* ---------------- BUSCA ---------------- */
document.getElementById('search-input').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

/* ---------------- CONTADOR DA ESTANTE ---------------- */
function updateShelfCount(){
  document.getElementById('shelf-count').textContent = getEstante().length;
}

/* ---------------- INIT ---------------- */
main.innerHTML = `<div class="empty-state">Carregando...</div>`;
loadBooks();
updateShelfCount();
</script>
</body>
</html>
