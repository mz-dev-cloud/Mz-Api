<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor — Acervo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0f0c12; --bg-soft:#171219; --panel:#1c1620;
  --ink:#ece4d8; --ink-soft:#948b96; --ink-faint:#5c5462;
  --accent:#c9a227; --border:rgba(236,228,216,.1);
  --c-acao:#7a2e1f; --c-suspense:#2a3347; --c-terror:#2f3b2a;
  --c-mais18:#4a1f2b; --c-magia:#5b3a6b; --c-romance:#7a2e3d;
  --c-fantasia:#3a4a63; --c-documentarios:#3a3a2a; --c-ficcao:#2e4a4a;
}
body.theme-sepia{
  --bg:#efe3c8; --bg-soft:#e6d7b8; --panel:#e6d7b8;
  --ink:#3b2f22; --ink-soft:#6b5c47; --ink-faint:#9c8a6d;
  --border:rgba(59,47,34,.15); --accent:#8a5a2b;
}
body.theme-claro{
  --bg:#ffffff; --bg-soft:#f4f4f4; --panel:#f4f4f4;
  --ink:#1a1a1a; --ink-soft:#555555; --ink-faint:#999999;
  --border:rgba(0,0,0,.1); --accent:#a8790e;
}
body.theme-preto{
  --bg:#000000; --bg-soft:#050505; --panel:#0a0a0a;
  --ink:#e8e8e8; --ink-soft:#8a8a8a; --ink-faint:#555555;
  --border:rgba(255,255,255,.08); --accent:#c9a227;
}
body.theme-sepia, body.theme-claro, body.theme-preto{ background:var(--bg); }
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:
    radial-gradient(900px 500px at 12% -8%, #241b28, transparent 60%),
    radial-gradient(700px 500px at 105% 10%, #1b2230, transparent 55%),
    var(--bg);
  color:var(--ink); font-family:'Inter',sans-serif;
}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}

header{
  position:sticky; top:0; z-index:50; backdrop-filter:blur(10px);
  background:rgba(15,12,18,.75); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; padding:16px clamp(20px,5vw,64px);
}
.logo{ font-family:'Fraunces',serif; font-weight:600; font-size:18px; display:flex; align-items:center; gap:8px;}
.logo a{ color:inherit; text-decoration:none; display:flex; align-items:center; gap:8px;}
.logo .mark{ color:var(--accent); font-size:20px; line-height:1;}
.back-link{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-faint); text-decoration:none; display:flex; align-items:center; gap:6px;}
.back-link:hover{ color:var(--accent);}
.back-link svg{ width:13px; height:13px;}

main{ max-width:720px; margin:0 auto; padding:36px clamp(20px,5vw,40px) 100px;}

.state-loading, .state-error{ text-align:center; padding:100px 20px; color:var(--ink-faint); font-size:13.5px;}

/* ---------- tela de escolha de capítulo ---------- */
.pick-head{ display:flex; gap:20px; align-items:flex-start; margin-bottom:32px;}
.pick-cover{
  width:110px; height:156px; border-radius:8px; flex:0 0 110px; overflow:hidden; position:relative;
  display:flex; align-items:flex-end; justify-content:center; text-align:center; padding:12px;
  box-shadow:0 14px 24px -14px rgba(0,0,0,.7);
}
.pick-cover img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.pick-cover .ph{ font-family:'Fraunces',serif; font-weight:600; font-size:13px; color:#fff; position:relative;}
.pick-info{ flex:1; min-width:0; padding-top:4px;}
.pick-cat{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:8px;}
.pick-info h1{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0 0 10px; line-height:1.2;}
.pick-info p{ color:var(--ink-soft); font-size:13.5px; line-height:1.6; margin:0;}

.chapter-list{ display:flex; flex-direction:column; gap:10px;}
.chapter-row{
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.chapter-row:hover{ border-color:var(--accent);}
.chapter-row .c-name{ font-family:'Fraunces',serif; font-weight:600; font-size:15px;}
.chapter-row .c-sub{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-faint); margin-top:3px;}
.chapter-row .c-arrow{ color:var(--ink-faint); flex-shrink:0;}
.chapter-row .c-arrow svg{ width:16px; height:16px;}
.chapter-row.continue{ border-color:var(--accent); background:linear-gradient(160deg, rgba(201,162,39,.12), transparent);}
.chapter-row.continue .c-sub{ color:var(--accent);}

/* ---------- tela de leitura ---------- */
.read-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:12px;}
.read-top .r-info{ min-width:0;}
.read-top .r-cat{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:6px;}
.read-top h1{ font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin:0; line-height:1.25;}
.read-top .r-chapter{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); margin-top:4px;}
.list-btn{
  flex-shrink:0; width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:none;
  display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
}
.list-btn:hover{ border-color:var(--accent); color:var(--accent);}
.list-btn svg{ width:16px; height:16px;}

.chapter-content{
  font-family:'Fraunces',serif; font-size:var(--reader-fs,17px); line-height:1.85; color:var(--ink);
  margin-bottom:44px;
}
body.reader-bold .ch-para{ font-weight:600; }
.ch-para{
  margin:0 0 22px; padding:2px 6px; margin-left:-6px; border-radius:5px;
  white-space:pre-wrap; word-wrap:break-word; cursor:pointer; transition:background .15s;
}
.ch-para:hover{ background:rgba(201,162,39,.08); }
.ch-para.marked{
  background:rgba(255,214,64,.16); box-shadow:inset 3px 0 0 var(--accent);
}
.mark-hint{
  font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint);
  margin-bottom:18px;
}
.mark-badge{
  display:flex; align-items:center; gap:10px; font-family:'JetBrains Mono',monospace; font-size:11.5px;
  color:var(--accent); background:rgba(201,162,39,.1); border:1px solid rgba(201,162,39,.3);
  padding:9px 14px; border-radius:9px; margin-bottom:22px; width:fit-content;
}
.mark-badge span{ flex-shrink:0; }
.mark-badge .mb-sep{ color:var(--ink-faint); }
.mark-badge button{
  background:none; border:none; color:var(--accent); font-size:11.5px; text-decoration:underline;
  padding:0; font-family:inherit; font-weight:600;
}
.mark-badge button#remove-mark-btn{ color:var(--ink-faint); font-weight:400; }
.mark-badge button:hover{ color:var(--accent); }

.font-size-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
.fs-btn{
  width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--bg-soft);
  color:var(--ink); font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; flex-shrink:0;
}
.fs-btn:hover{ border-color:var(--accent); color:var(--accent); }
.fs-val{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); }
.bold-toggle{
  width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg-soft);
  color:var(--ink); font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
}
.bold-toggle.active{ border-color:var(--accent); color:var(--accent); background:rgba(201,162,39,.12); }
.pop-divider{ height:1px; background:var(--border); margin:2px 0; }

.top-actions{ display:flex; gap:8px; flex-shrink:0; }
.settings-wrap{ position:relative; }
.settings-pop{
  position:absolute; top:46px; right:0; background:var(--panel); border:1px solid var(--border);
  border-radius:12px; padding:14px; display:none; flex-direction:column; gap:8px; z-index:60;
  box-shadow:0 14px 30px -14px rgba(0,0,0,.6); width:190px;
}
.settings-pop.open{ display:flex; }
.settings-pop .st-label{
  font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase;
  letter-spacing:.06em; color:var(--ink-faint);
}
.theme-options{ display:flex; gap:8px; }
.theme-swatch{
  flex:1; height:38px; border-radius:8px; border:2px solid transparent; cursor:pointer; padding:0;
}
.theme-swatch.active{ border-color:var(--accent); }
.theme-swatch[data-theme="escuro"]{ background:#171219; }
.theme-swatch[data-theme="sepia"]{ background:#efe3c8; }
.theme-swatch[data-theme="claro"]{ background:#ffffff; }
.theme-swatch[data-theme="preto"]{ background:#000000; border:2px solid rgba(255,255,255,.15); }

.read-nav{ display:flex; gap:12px; border-top:1px solid var(--border); padding-top:24px;}
.nav-btn{
  flex:1; background:var(--panel); border:1px solid var(--border); color:var(--ink);
  padding:14px 18px; border-radius:12px; font-size:13px; display:flex; align-items:center; gap:8px;
}
.nav-btn.next{ justify-content:flex-end; background:var(--accent); color:#171219; border:none; font-weight:600;}
.nav-btn:disabled{ opacity:.35; cursor:not-allowed;}
.nav-btn svg{ width:15px; height:15px; flex-shrink:0;}

/* ---------- player de trilha sonora ---------- */
.music-player{
  position:fixed; bottom:20px; right:20px; z-index:90; display:none; align-items:center; gap:8px;
  background:rgba(23,18,25,.85); backdrop-filter:blur(10px); border:1px solid var(--border);
  border-radius:999px; padding:7px; box-shadow:0 14px 30px -14px rgba(0,0,0,.75);
}
.music-btn, .music-btn-restart{
  border:none; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.music-btn{ width:42px; height:42px; background:var(--accent); color:#171219; }
.music-btn svg{ width:18px; height:18px; }
.music-btn-restart{
  width:34px; height:34px; background:none; color:var(--ink-soft); border:1px solid var(--border);
}
.music-btn-restart svg{ width:14px; height:14px; }
.music-btn-restart:hover{ color:var(--accent); border-color:var(--accent); }
.music-player.needs-tap .music-btn{ animation:music-pulse 1.6s infinite; }
@keyframes music-pulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(201,162,39,.55); }
  50%{ box-shadow:0 0 0 9px rgba(201,162,39,0); }
}
</style>
</head>
<body>

<header>
  <div class="logo"><a href="index.html"><span class="mark">✦</span> Acervo</a></div>
  <a class="back-link" id="back-link" href="biblioteca.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    voltar
  </a>
</header>

<main id="main">
  <div class="state-loading">Carregando...</div>
</main>

<div class="music-player" id="music-player">
  <button class="music-btn-restart" id="music-restart" title="Voltar do início">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
  </button>
  <button class="music-btn" id="music-toggle" title="Tocar/pausar trilha sonora">
    <svg id="music-icon-play" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
    <svg id="music-icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
  </button>
</div>
<audio id="book-audio" preload="auto"></audio>

<script>
const SUPABASE_URL = 'https://xdmayiruvcfwakcjmuay.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkbWF5aXJ1dmNmd2FrY2ptdWF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODg5MTUsImV4cCI6MjEwMjA2NDkxNX0.bTul_H7leU6rS4qfieqLmr9mYcOhZF_4j25bT65m7lw';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATEGORIES = [
  {id:'acao', label:'Ação'}, {id:'suspense', label:'Suspense'}, {id:'terror', label:'Terror'},
  {id:'mais18', label:'+18'}, {id:'magia', label:'Magia'}, {id:'romance', label:'Romance'},
  {id:'fantasia', label:'Fantasia'}, {id:'documentarios', label:'Documentários'}, {id:'ficcao', label:'Ficção'},
];
function labelFor(catId){ return (CATEGORIES.find(c=>c.id===catId)||{}).label || catId; }
function coverStyle(catId){ return `background:linear-gradient(160deg, var(--c-${catId}), #14101a);`; }
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

/* ---------------- histórico de leitura (mesmo formato usado na estante) ---------------- */
function getLeituras(){
  try{ return JSON.parse(localStorage.getItem('acervo_leituras') || '{}'); }
  catch(e){ return {}; }
}
function saveLeituras(data){ localStorage.setItem('acervo_leituras', JSON.stringify(data)); }
function recordRead(bookId, chapterNumber){
  const data = getLeituras();
  const entry = data[bookId] || {count:0, last:0, lastChapter:1};
  entry.count += 1;
  entry.last = Date.now();
  entry.lastChapter = chapterNumber;
  data[bookId] = entry;
  saveLeituras(data);
}
function getLastChapter(bookId){
  const data = getLeituras();
  return data[bookId] ? data[bookId].lastChapter : null;
}

/* ---------------- tema de fundo da leitura (local, por dispositivo) ---------------- */
function getTheme(){ return localStorage.getItem('acervo_leitor_tema') || 'escuro'; }
function applyTheme(theme){
  document.body.classList.remove('theme-sepia','theme-claro','theme-preto');
  if(theme === 'sepia' || theme === 'claro' || theme === 'preto'){
    document.body.classList.add('theme-' + theme);
  }
  localStorage.setItem('acervo_leitor_tema', theme);
}

/* ---------------- zoom do texto (local, por dispositivo) ---------------- */
function getFontSize(){ return parseInt(localStorage.getItem('acervo_leitor_fonte') || '17', 10); }
function applyFontSize(px){
  px = Math.max(14, Math.min(24, px));
  document.documentElement.style.setProperty('--reader-fs', px + 'px');
  localStorage.setItem('acervo_leitor_fonte', String(px));
}

/* ---------------- negrito (local, por dispositivo) ---------------- */
function getBold(){ return localStorage.getItem('acervo_leitor_negrito') === '1'; }
function applyBold(on){
  document.body.classList.toggle('reader-bold', on);
  localStorage.setItem('acervo_leitor_negrito', on ? '1' : '0');
}

/* ---------------- marca-texto (marca onde a pessoa parou, só local) ---------------- */
function getMarcadores(){
  try{ return JSON.parse(localStorage.getItem('acervo_marcadores') || '{}'); }
  catch(e){ return {}; }
}
function saveMarcadores(data){ localStorage.setItem('acervo_marcadores', JSON.stringify(data)); }
function markerKey(bId, chapterNumber){ return bId + '-' + chapterNumber; }
function getMarker(bId, chapterNumber){ return getMarcadores()[markerKey(bId, chapterNumber)]; }
function setMarker(bId, chapterNumber, pIdx){
  const data = getMarcadores();
  data[markerKey(bId, chapterNumber)] = pIdx;
  saveMarcadores(data);
}
function removeMarker(bId, chapterNumber){
  const data = getMarcadores();
  delete data[markerKey(bId, chapterNumber)];
  saveMarcadores(data);
}

/* ---------------- trilha sonora do livro ---------------- */
function setupMusicPlayer(musicUrl){
  const player = document.getElementById('music-player');
  const audioEl = document.getElementById('book-audio');
  if(!musicUrl){ player.style.display = 'none'; return; }

  audioEl.src = musicUrl;
  audioEl.loop = true;
  player.style.display = 'flex';

  const playIcon = document.getElementById('music-icon-play');
  const pauseIcon = document.getElementById('music-icon-pause');

  function updateIcon(){
    const playing = !audioEl.paused;
    playIcon.style.display = playing ? 'none' : 'block';
    pauseIcon.style.display = playing ? 'block' : 'none';
  }

  audioEl.play().then(()=>{
    player.classList.remove('needs-tap');
    updateIcon();
  }).catch(()=>{
    // navegador bloqueou o autoplay com som — espera o toque no botão
    player.classList.add('needs-tap');
    updateIcon();
  });

  document.getElementById('music-toggle').addEventListener('click', ()=>{
    player.classList.remove('needs-tap');
    if(audioEl.paused) audioEl.play().catch(()=>{});
    else audioEl.pause();
  });

  document.getElementById('music-restart').addEventListener('click', ()=>{
    player.classList.remove('needs-tap');
    audioEl.currentTime = 0;
    if(audioEl.paused) audioEl.play().catch(()=>{});
  });

  audioEl.addEventListener('play', updateIcon);
  audioEl.addEventListener('pause', updateIcon);
}

/* ---------------- estante (cookie) — usado só pra saber pra onde voltar ---------------- */
function getCookie(name){
  const match = document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'));
  return match ? decodeURIComponent(match[2]) : null;
}

const main = document.getElementById('main');
const params = new URLSearchParams(location.search);
const bookId = params.get('book');
let chapterParam = parseInt(params.get('chapter'), 10);
if(!chapterParam || chapterParam < 1) chapterParam = null;

applyTheme(getTheme());
applyFontSize(getFontSize());
applyBold(getBold());

document.addEventListener('click', (e)=>{
  const pop = document.getElementById('settings-pop');
  const btn = document.getElementById('settings-btn');
  if(pop && pop.classList.contains('open') && !pop.contains(e.target) && e.target !== btn && !btn?.contains(e.target)){
    pop.classList.remove('open');
  }
});

let book = null;
let chapters = [];

async function init(){
  if(!bookId){
    main.innerHTML = `<div class="state-error">Nenhum livro informado.</div>`;
    return;
  }

  const { data: bookRow, error: bookErr } = await sb.from('books').select('*').eq('id', bookId).single();
  if(bookErr || !bookRow){
    main.innerHTML = `<div class="state-error">Não foi possível encontrar esse livro.</div>`;
    return;
  }
  book = bookRow;

  const { data: chapterRows, error: chErr } = await sb.from('book_chapters').select('*').eq('book_id', bookId).order('chapter_number', { ascending:true });
  if(chErr){
    main.innerHTML = `<div class="state-error">Não foi possível carregar os capítulos.</div>`;
    return;
  }
  chapters = chapterRows || [];

  if(chapters.length === 0){
    main.innerHTML = `<div class="state-error">Esse livro ainda não tem capítulos publicados.</div>`;
    return;
  }

  // referência ativada na estante -> volta pra estante; senão, biblioteca
  const backLink = document.getElementById('back-link');
  if(document.referrer.includes('estante.html')) backLink.href = 'estante.html';

  setupMusicPlayer(book.music_url);

  if(chapterParam){
    const idx = chapters.findIndex(c => c.chapter_number === chapterParam);
    renderChapter(idx >= 0 ? idx : 0);
  } else if(chapters.length === 1){
    renderChapter(0);
  } else {
    renderPicker();
  }
}

function renderPicker(){
  const lastChapter = getLastChapter(bookId);
  const hasCover = !!book.cover_url;

  const continueRow = lastChapter ? `
    <div class="chapter-row continue" data-idx="${chapters.findIndex(c=>c.chapter_number===lastChapter)}">
      <div>
        <div class="c-name">Continuar lendo</div>
        <div class="c-sub">Capítulo ${lastChapter}</div>
      </div>
      <div class="c-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>
    </div>
  ` : '';

  const rows = chapters.map((c, idx) => `
    <div class="chapter-row" data-idx="${idx}">
      <div>
        <div class="c-name">Capítulo ${c.chapter_number}</div>
        <div class="c-sub">${(c.content||'').trim().split(/\s+/).length} palavras</div>
      </div>
      <div class="c-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>
    </div>
  `).join('');

  main.innerHTML = `
    <div class="pick-head">
      <div class="pick-cover" style="${coverStyle(book.category)}">
        ${hasCover ? `<img src="${book.cover_url}">` : `<span class="ph">${escapeHtml(book.title)}</span>`}
      </div>
      <div class="pick-info">
        <span class="pick-cat">${labelFor(book.category)}</span>
        <h1>${escapeHtml(book.title)}</h1>
        ${book.summary ? `<p>${escapeHtml(book.summary)}</p>` : ''}
      </div>
    </div>
    <div class="chapter-list">${continueRow}${rows}</div>
  `;

  main.querySelectorAll('.chapter-row').forEach(el=>{
    el.addEventListener('click', ()=> renderChapter(parseInt(el.dataset.idx, 10)));
  });
}

function renderChapter(idx){
  const chapter = chapters[idx];
  if(!chapter) return;

  recordRead(bookId, chapter.chapter_number);
  history.replaceState(null, '', `leitor.html?book=${bookId}&chapter=${chapter.chapter_number}`);

  const hasPrev = idx > 0;
  const hasNext = idx < chapters.length - 1;

  const paragraphs = (chapter.content || '').split(/\n+/).filter(p => p.trim().length > 0);
  const markedIdx = getMarker(bookId, chapter.chapter_number);
  const hasMark = markedIdx !== undefined && markedIdx !== null && markedIdx < paragraphs.length;

  const paragraphsHtml = paragraphs.map((p, pIdx) => `
    <p class="ch-para${hasMark && pIdx === markedIdx ? ' marked' : ''}" data-pidx="${pIdx}">${escapeHtml(p)}</p>
  `).join('');

  const markSectionHtml = hasMark ? `
    <div class="mark-badge">
      <span>🖍️ Marcado onde você parou</span>
      <button id="goto-mark-btn">ir até lá</button>
      <span class="mb-sep">·</span>
      <button id="remove-mark-btn">remover</button>
    </div>
  ` : `<div class="mark-hint">Toque em um parágrafo para marcar onde você parou.</div>`;

  main.innerHTML = `
    <div class="read-top">
      <div class="r-info">
        <span class="r-cat">${labelFor(book.category)}</span>
        <h1>${escapeHtml(book.title)}</h1>
        <div class="r-chapter">Capítulo ${chapter.chapter_number} de ${chapters.length}</div>
      </div>
      <div class="top-actions">
        <div class="settings-wrap">
          <button class="list-btn" id="settings-btn" title="Fundo de leitura">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1.04 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.04z"/></svg>
          </button>
          <div class="settings-pop" id="settings-pop">
            <div class="st-label">Fundo de leitura</div>
            <div class="theme-options">
              <button class="theme-swatch" data-theme="escuro" title="Escuro"></button>
              <button class="theme-swatch" data-theme="sepia" title="Sépia"></button>
              <button class="theme-swatch" data-theme="claro" title="Claro"></button>
              <button class="theme-swatch" data-theme="preto" title="Preto"></button>
            </div>
            <div class="pop-divider"></div>
            <div class="st-label">Tamanho do texto</div>
            <div class="font-size-row">
              <button class="fs-btn" id="fs-dec" title="Diminuir">A-</button>
              <span class="fs-val" id="fs-val">17px</span>
              <button class="fs-btn" id="fs-inc" title="Aumentar">A+</button>
            </div>
            <div class="pop-divider"></div>
            <button class="bold-toggle" id="bold-toggle">Negrito</button>
          </div>
        </div>
        ${chapters.length > 1 ? `
          <button class="list-btn" id="list-btn" title="Ver capítulos">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
        ` : ''}
      </div>
    </div>
    ${markSectionHtml}
    <div class="chapter-content">${paragraphsHtml}</div>
    <div class="read-nav">
      <button class="nav-btn prev" id="prev-btn" ${hasPrev ? '' : 'disabled'}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Capítulo anterior
      </button>
      <button class="nav-btn next" id="next-btn" ${hasNext ? '' : 'disabled'}>
        ${hasNext ? 'Próximo capítulo' : 'Fim do livro'}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });

  const listBtn = document.getElementById('list-btn');
  if(listBtn) listBtn.addEventListener('click', renderPicker);

  const prevBtn = document.getElementById('prev-btn');
  if(hasPrev) prevBtn.addEventListener('click', ()=> renderChapter(idx - 1));

  const nextBtn = document.getElementById('next-btn');
  if(hasNext) nextBtn.addEventListener('click', ()=> renderChapter(idx + 1));

  // clique em um parágrafo: marca (ou desmarca, se já for o marcado) onde a pessoa parou
  main.querySelectorAll('.ch-para').forEach(el=>{
    el.addEventListener('click', ()=>{
      const pIdx = parseInt(el.dataset.pidx, 10);
      const current = getMarker(bookId, chapter.chapter_number);
      if(current === pIdx) removeMarker(bookId, chapter.chapter_number);
      else setMarker(bookId, chapter.chapter_number, pIdx);
      const scrollY = window.scrollY;
      renderChapter(idx);
      window.scrollTo({ top: scrollY, behavior:'auto' });
    });
  });

  const removeMarkBtn = document.getElementById('remove-mark-btn');
  if(removeMarkBtn) removeMarkBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const scrollY = window.scrollY;
    removeMarker(bookId, chapter.chapter_number);
    renderChapter(idx);
    window.scrollTo({ top: scrollY, behavior:'auto' });
  });

  const gotoMarkBtn = document.getElementById('goto-mark-btn');
  if(gotoMarkBtn) gotoMarkBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    const target = main.querySelector('.ch-para.marked');
    if(target) target.scrollIntoView({ behavior:'smooth', block:'center' });
  });

  // seletor de fundo de leitura
  const settingsBtn = document.getElementById('settings-btn');
  const settingsPop = document.getElementById('settings-pop');
  function refreshSwatches(){
    const current = getTheme();
    main.querySelectorAll('.theme-swatch').forEach(sw=>{
      sw.classList.toggle('active', sw.dataset.theme === current);
    });
  }
  function refreshFontVal(){
    document.getElementById('fs-val').textContent = getFontSize() + 'px';
  }
  function refreshBoldToggle(){
    document.getElementById('bold-toggle').classList.toggle('active', getBold());
  }
  refreshSwatches();
  refreshFontVal();
  refreshBoldToggle();
  if(settingsBtn){
    settingsBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      settingsPop.classList.toggle('open');
    });
  }
  main.querySelectorAll('.theme-swatch').forEach(sw=>{
    sw.addEventListener('click', (e)=>{
      e.stopPropagation();
      applyTheme(sw.dataset.theme);
      refreshSwatches();
    });
  });
  document.getElementById('fs-dec').addEventListener('click', (e)=>{
    e.stopPropagation();
    applyFontSize(getFontSize() - 1);
    refreshFontVal();
  });
  document.getElementById('fs-inc').addEventListener('click', (e)=>{
    e.stopPropagation();
    applyFontSize(getFontSize() + 1);
    refreshFontVal();
  });
  document.getElementById('bold-toggle').addEventListener('click', (e)=>{
    e.stopPropagation();
    applyBold(!getBold());
    refreshBoldToggle();
  });
}

init();
</script>
</body>
</html>
