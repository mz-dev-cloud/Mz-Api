<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leitor — Acervo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0f0c12; --bg-soft:#171219; --panel:#1c1620;
  --ink:#ece4d8; --ink-soft:#948b96; --ink-faint:#5c5462;
  --accent:#c9a227; --border:rgba(236,228,216,.1);
  --c-acao:#7a2e1f; --c-suspense:#2a3347; --c-terror:#2f3b2a;
  --c-mais18:#4a1f2b; --c-magia:#5b3a6b; --c-romance:#7a2e3d;
  --c-fantasia:#3a4a63; --c-documentarios:#3a3a2a; --c-ficcao:#2e4a4a;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:
    radial-gradient(900px 500px at 12% -8%, #241b28, transparent 60%),
    radial-gradient(700px 500px at 105% 10%, #1b2230, transparent 55%),
    var(--bg);
  color:var(--ink); font-family:'Inter',sans-serif;
}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}

header{
  position:sticky; top:0; z-index:50; backdrop-filter:blur(10px);
  background:rgba(15,12,18,.75); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; padding:16px clamp(20px,5vw,64px);
}
.logo{ font-family:'Fraunces',serif; font-weight:600; font-size:18px; display:flex; align-items:center; gap:8px;}
.logo a{ color:inherit; text-decoration:none; display:flex; align-items:center; gap:8px;}
.logo .mark{ color:var(--accent); font-size:20px; line-height:1;}
.back-link{ font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--ink-faint); text-decoration:none; display:flex; align-items:center; gap:6px;}
.back-link:hover{ color:var(--accent);}
.back-link svg{ width:13px; height:13px;}

main{ max-width:720px; margin:0 auto; padding:36px clamp(20px,5vw,40px) 100px;}

.state-loading, .state-error{ text-align:center; padding:100px 20px; color:var(--ink-faint); font-size:13.5px;}

/* ---------- tela de escolha de capítulo ---------- */
.pick-head{ display:flex; gap:20px; align-items:flex-start; margin-bottom:32px;}
.pick-cover{
  width:110px; height:156px; border-radius:8px; flex:0 0 110px; overflow:hidden; position:relative;
  display:flex; align-items:flex-end; justify-content:center; text-align:center; padding:12px;
  box-shadow:0 14px 24px -14px rgba(0,0,0,.7);
}
.pick-cover img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.pick-cover .ph{ font-family:'Fraunces',serif; font-weight:600; font-size:13px; color:#fff; position:relative;}
.pick-info{ flex:1; min-width:0; padding-top:4px;}
.pick-cat{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:8px;}
.pick-info h1{ font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0 0 10px; line-height:1.2;}
.pick-info p{ color:var(--ink-soft); font-size:13.5px; line-height:1.6; margin:0;}

.chapter-list{ display:flex; flex-direction:column; gap:10px;}
.chapter-row{
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:16px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.chapter-row:hover{ border-color:var(--accent);}
.chapter-row .c-name{ font-family:'Fraunces',serif; font-weight:600; font-size:15px;}
.chapter-row .c-sub{ font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-faint); margin-top:3px;}
.chapter-row .c-arrow{ color:var(--ink-faint); flex-shrink:0;}
.chapter-row .c-arrow svg{ width:16px; height:16px;}
.chapter-row.continue{ border-color:var(--accent); background:linear-gradient(160deg, rgba(201,162,39,.12), transparent);}
.chapter-row.continue .c-sub{ color:var(--accent);}

/* ---------- tela de leitura ---------- */
.read-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:12px;}
.read-top .r-info{ min-width:0;}
.read-top .r-cat{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:6px;}
.read-top h1{ font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin:0; line-height:1.25;}
.read-top .r-chapter{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); margin-top:4px;}
.list-btn{
  flex-shrink:0; width:38px; height:38px; border-radius:50%; border:1px solid var(--border); background:none;
  display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
}
.list-btn:hover{ border-color:var(--accent); color:var(--accent);}
.list-btn svg{ width:16px; height:16px;}

.chapter-content{
  font-family:'Fraunces',serif; font-size:17px; line-height:1.85; color:var(--ink);
  white-space:pre-wrap; word-wrap:break-word; margin-bottom:44px;
}

.read-nav{ display:flex; gap:12px; border-top:1px solid var(--border); padding-top:24px;}
.nav-btn{
  flex:1; background:var(--panel); border:1px solid var(--border); color:var(--ink);
  padding:14px 18px; border-radius:12px; font-size:13px; display:flex; align-items:center; gap:8px;
}
.nav-btn.next{ justify-content:flex-end; background:var(--accent); color:#171219; border:none; font-weight:600;}
.nav-btn:disabled{ opacity:.35; cursor:not-allowed;}
.nav-btn svg{ width:15px; height:15px; flex-shrink:0;}
</style>
</head>
<body>

<header>
  <div class="logo"><a href="index.html"><span class="mark">✦</span> Acervo</a></div>
  <a class="back-link" id="back-link" href="biblioteca.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    voltar
  </a>
</header>

<main id="main">
  <div class="state-loading">Carregando...</div>
</main>

<script>
const SUPABASE_URL = 'https://xdmayiruvcfwakcjmuay.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkbWF5aXJ1dmNmd2FrY2ptdWF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODg5MTUsImV4cCI6MjEwMjA2NDkxNX0.bTul_H7leU6rS4qfieqLmr9mYcOhZF_4j25bT65m7lw';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATEGORIES = [
  {id:'acao', label:'Ação'}, {id:'suspense', label:'Suspense'}, {id:'terror', label:'Terror'},
  {id:'mais18', label:'+18'}, {id:'magia', label:'Magia'}, {id:'romance', label:'Romance'},
  {id:'fantasia', label:'Fantasia'}, {id:'documentarios', label:'Documentários'}, {id:'ficcao', label:'Ficção'},
];
function labelFor(catId){ return (CATEGORIES.find(c=>c.id===catId)||{}).label || catId; }
function coverStyle(catId){ return `background:linear-gradient(160deg, var(--c-${catId}), #14101a);`; }
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

/* ---------------- histórico de leitura (mesmo formato usado na estante) ---------------- */
function getLeituras(){
  try{ return JSON.parse(localStorage.getItem('acervo_leituras') || '{}'); }
  catch(e){ return {}; }
}
function saveLeituras(data){ localStorage.setItem('acervo_leituras', JSON.stringify(data)); }
function recordRead(bookId, chapterNumber){
  const data = getLeituras();
  const entry = data[bookId] || {count:0, last:0, lastChapter:1};
  entry.count += 1;
  entry.last = Date.now();
  entry.lastChapter = chapterNumber;
  data[bookId] = entry;
  saveLeituras(data);
}
function getLastChapter(bookId){
  const data = getLeituras();
  return data[bookId] ? data[bookId].lastChapter : null;
}

/* ---------------- estante (cookie) — usado só pra saber pra onde voltar ---------------- */
function getCookie(name){
  const match = document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'));
  return match ? decodeURIComponent(match[2]) : null;
}

const main = document.getElementById('main');
const params = new URLSearchParams(location.search);
const bookId = params.get('book');
let chapterParam = parseInt(params.get('chapter'), 10);
if(!chapterParam || chapterParam < 1) chapterParam = null;

let book = null;
let chapters = [];

async function init(){
  if(!bookId){
    main.innerHTML = `<div class="state-error">Nenhum livro informado.</div>`;
    return;
  }

  const { data: bookRow, error: bookErr } = await sb.from('books').select('*').eq('id', bookId).single();
  if(bookErr || !bookRow){
    main.innerHTML = `<div class="state-error">Não foi possível encontrar esse livro.</div>`;
    return;
  }
  book = bookRow;

  const { data: chapterRows, error: chErr } = await sb.from('book_chapters').select('*').eq('book_id', bookId).order('chapter_number', { ascending:true });
  if(chErr){
    main.innerHTML = `<div class="state-error">Não foi possível carregar os capítulos.</div>`;
    return;
  }
  chapters = chapterRows || [];

  if(chapters.length === 0){
    main.innerHTML = `<div class="state-error">Esse livro ainda não tem capítulos publicados.</div>`;
    return;
  }

  // referência ativada na estante -> volta pra estante; senão, biblioteca
  const backLink = document.getElementById('back-link');
  if(document.referrer.includes('estante.html')) backLink.href = 'estante.html';

  if(chapterParam){
    const idx = chapters.findIndex(c => c.chapter_number === chapterParam);
    renderChapter(idx >= 0 ? idx : 0);
  } else if(chapters.length === 1){
    renderChapter(0);
  } else {
    renderPicker();
  }
}

function renderPicker(){
  const lastChapter = getLastChapter(bookId);
  const hasCover = !!book.cover_url;

  const continueRow = lastChapter ? `
    <div class="chapter-row continue" data-idx="${chapters.findIndex(c=>c.chapter_number===lastChapter)}">
      <div>
        <div class="c-name">Continuar lendo</div>
        <div class="c-sub">Capítulo ${lastChapter}</div>
      </div>
      <div class="c-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>
    </div>
  ` : '';

  const rows = chapters.map((c, idx) => `
    <div class="chapter-row" data-idx="${idx}">
      <div>
        <div class="c-name">Capítulo ${c.chapter_number}</div>
        <div class="c-sub">${(c.content||'').trim().split(/\s+/).length} palavras</div>
      </div>
      <div class="c-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>
    </div>
  `).join('');

  main.innerHTML = `
    <div class="pick-head">
      <div class="pick-cover" style="${coverStyle(book.category)}">
        ${hasCover ? `<img src="${book.cover_url}">` : `<span class="ph">${escapeHtml(book.title)}</span>`}
      </div>
      <div class="pick-info">
        <span class="pick-cat">${labelFor(book.category)}</span>
        <h1>${escapeHtml(book.title)}</h1>
        ${book.summary ? `<p>${escapeHtml(book.summary)}</p>` : ''}
      </div>
    </div>
    <div class="chapter-list">${continueRow}${rows}</div>
  `;

  main.querySelectorAll('.chapter-row').forEach(el=>{
    el.addEventListener('click', ()=> renderChapter(parseInt(el.dataset.idx, 10)));
  });
}

function renderChapter(idx){
  const chapter = chapters[idx];
  if(!chapter) return;

  recordRead(bookId, chapter.chapter_number);
  history.replaceState(null, '', `leitor.html?book=${bookId}&chapter=${chapter.chapter_number}`);

  const hasPrev = idx > 0;
  const hasNext = idx < chapters.length - 1;

  main.innerHTML = `
    <div class="read-top">
      <div class="r-info">
        <span class="r-cat">${labelFor(book.category)}</span>
        <h1>${escapeHtml(book.title)}</h1>
        <div class="r-chapter">Capítulo ${chapter.chapter_number} de ${chapters.length}</div>
      </div>
      ${chapters.length > 1 ? `
        <button class="list-btn" id="list-btn" title="Ver capítulos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      ` : ''}
    </div>
    <div class="chapter-content">${escapeHtml(chapter.content || '')}</div>
    <div class="read-nav">
      <button class="nav-btn prev" id="prev-btn" ${hasPrev ? '' : 'disabled'}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Capítulo anterior
      </button>
      <button class="nav-btn next" id="next-btn" ${hasNext ? '' : 'disabled'}>
        ${hasNext ? 'Próximo capítulo' : 'Fim do livro'}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });

  const listBtn = document.getElementById('list-btn');
  if(listBtn) listBtn.addEventListener('click', renderPicker);

  const prevBtn = document.getElementById('prev-btn');
  if(hasPrev) prevBtn.addEventListener('click', ()=> renderChapter(idx - 1));

  const nextBtn = document.getElementById('next-btn');
  if(hasNext) nextBtn.addEventListener('click', ()=> renderChapter(idx + 1));
}

init();
</script>
</body>
</html>
